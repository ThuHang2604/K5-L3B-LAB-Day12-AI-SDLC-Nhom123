<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1218; overflow: hidden; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client Quán Ăn Chợ Nổi (Nhom123). CHỈ ĐỌC snapshot từ GET /state, gửi phím qua POST /input,
 * qua màn chuyển bằng POST /continue. Vẽ ở khung logic 1280×720, chữ không chân ≥ 18 px.
 * Phím: WASD/mũi tên di chuyển · E tương tác · Space bắt cá · Esc/P tạm dừng · Shop: 1 Bình oxy, 2 Áo phao, Enter xong.
 */
const W = 1280, H = 720, FONT = "Arial, Helvetica, sans-serif";
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false, frameT = 0;

const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh bông điên điển", canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng muối ớt",
  lau_mam: "Lẩu mắm miền Tây" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "bông điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const KIND_COLOR = { ca_loc: "#6f8f45", ca_linh: "#d6e6f2", ca_keo: "#d99a5b", bong_dien_dien: "#f2c230", bong_sung: "#ec7fa3", keo_neo: "#8fcf6b" };
const UP_NAME = { oxygen: "Bình oxy", hp: "Áo phao (thêm Máu)" };
const kn = (k) => KIND_NAME[k] || k, dn = (d) => DISH_NAME[d] || d;

// ---------------- vào: phím ----------------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let menuSel = 0, pauseSel = 0, introShownAt = 0, lastHold = null, quitShown = false;
let queue = [], inflight = false, lastSent = "";

function currentInput(extra) {
  const phase = snap ? snap.phase : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (phase === "quan") dy = -dy; // quan: lên màn hình = bắc = z dương
  return Object.assign({ move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"),
    pause: down.has("pause"), shop_done: down.has("shop_done") }, extra || {});
}
function send(body) { queue.push(JSON.stringify(body)); flush(); }
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s; queue.push(s); flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); } catch (e) {}
  }
  inflight = false;
}
const post = (path) => fetch(path, { method: "POST" }).catch(() => {});
function tap(name) { down.add(name); pushInput(); setTimeout(() => { down.delete(name); pushInput(); }, 60); }
function cont() { post("/continue"); introShownAt = 0; }

function overlayActive() {
  if (!snap) return null;
  if (snap.quit) return "quit";
  if (snap.ui_hold) return snap.ui_hold;
  if (snap.state === "paused") return "pause";
  return null;
}
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (e.repeat) return;
  const ov = overlayActive();
  if (ov === "menu") {
    if (k === "arrowup" || k === "w" || k === "arrowdown" || k === "s") menuSel = 1 - menuSel;
    else if (k === "enter" || k === " " || k === "e") menuSel === 0 ? cont() : doQuit();
    return;
  }
  if (ov === "day_intro" || ov === "evening_intro" || ov === "day_result") { cont(); return; }
  if (ov === "summary") { if (k === "enter" || k === "r") { post("/restart"); } return; }
  if (ov === "pause") {
    if (k === "arrowup" || k === "w" || k === "arrowdown" || k === "s") pauseSel = 1 - pauseSel;
    else if (k === "escape" || k === "p") tap("pause");
    else if (k === "enter" || k === "e" || k === " ") pauseSel === 0 ? tap("pause") : toMenu();
    return;
  }
  if (k === "escape" || k === "p") { pauseSel = 0; tap("pause"); return; }
  if (snap && snap.phase === "shop") {
    if (k === "1") send(currentInput({ buy: "oxygen" }));
    else if (k === "2") send(currentInput({ buy: "hp" }));
    else if (k === "enter") tap("shop_done");
    return;
  }
  if (MOVE_KEYS[k]) down.add(MOVE_KEYS[k]);
  else if (k === "e") down.add("interact");
  else if (k === " ") down.add("catch");
  else if (k === "r" && snap && snap.mode !== "day") { post("/restart"); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });
function toMenu() { down.clear(); lastSent = ""; post("/restart"); }
function doQuit() { post("/quit"); }

let buttons = [];
cv.addEventListener("click", (e) => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
});

// ---------------- ra: poll snapshot ----------------
async function poll() {
  try { const r = await fetch("/state", { cache: "no-store" }); snap = await r.json(); offline = false; }
  catch (e) { offline = true; }
  setTimeout(poll, 33);
}
poll();

// ---------------- tiện ích vẽ ----------------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const scale = Math.min(innerWidth / W, innerHeight / H);
  const cw = Math.round(W * scale), ch = Math.round(H * scale);
  if (cv.width !== Math.round(cw * dpr)) { cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr); }
  cv.style.width = cw + "px"; cv.style.height = ch + "px";
  cv.style.marginTop = Math.max(0, (innerHeight - ch) / 2) + "px";
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "bold " : "") + Math.max(18, o.size || 18) + "px " + FONT;
  ctx.fillStyle = o.color || "#f4f1e8";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.shadow !== false) { ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 3; }
  ctx.fillText(s, x, y);
  ctx.shadowBlur = 0;
}
function panel(x, y, w, h, a = 0.55) { ctx.fillStyle = `rgba(10,16,22,${a})`; roundRect(x, y, w, h, 10); ctx.fill(); }
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function fmtTime(t) { const s = Math.ceil(t / 60); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function heart(x, y, full) {
  ctx.fillStyle = full ? "#e5484d" : "rgba(255,255,255,.2)";
  ctx.beginPath(); ctx.moveTo(x, y + 6);
  ctx.bezierCurveTo(x, y, x - 10, y, x - 10, y + 7); ctx.bezierCurveTo(x - 10, y + 13, x, y + 17, x, y + 20);
  ctx.bezierCurveTo(x, y + 17, x + 10, y + 13, x + 10, y + 7); ctx.bezierCurveTo(x + 10, y, x, y, x, y + 6); ctx.fill();
}
function button(label, x, y, w, h, selected, fn) {
  ctx.fillStyle = selected ? "#d98e2b" : "rgba(255,255,255,.12)";
  roundRect(x, y, w, h, 10); ctx.fill();
  text(label, x + w / 2, y + h / 2 + 7, { size: 24, align: "center", bold: selected });
  buttons.push({ x, y, w, h, fn });
}
function plantDish(d) { return Object.keys(d || {}).map((k) => `${dn(k)} ×${d[k]}`); }

// ---------------- buổi sáng: mặt cắt sông ----------------
const GX0 = 40, GX1 = 1240, GY0 = 170, GY1 = 700;
function gsx(x) { const b = snap.meta ? snap.meta.bounds.x : [0, 100]; return GX0 + (x - b[0]) / (b[1] - b[0]) * (GX1 - GX0); }
function gsy(d) { const b = snap.meta ? snap.meta.bounds.d : [0, 30]; return GY0 + (d - b[0]) / (b[1] - b[0]) * (GY1 - GY0); }
function drawGather() {
  const s = snap, p = s.player, meta = s.meta || {};
  // trời hồng buổi sớm + bờ dừa nước
  let g = ctx.createLinearGradient(0, 0, 0, GY0);
  g.addColorStop(0, "#f7b7a3"); g.addColorStop(1, "#f6d7b0");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GY0);
  ctx.fillStyle = "#4f7a3a";
  for (let i = 0; i < 14; i++) { const x = 60 + i * 92; ctx.beginPath(); ctx.moveTo(x, GY0); ctx.quadraticCurveTo(x + 20, GY0 - 55, x + 50, GY0 - 40); ctx.quadraticCurveTo(x + 22, GY0 - 30, x + 12, GY0); ctx.fill(); }
  // nước phù sa theo vùng nông / giữa / sâu
  g = ctx.createLinearGradient(0, GY0, 0, GY1);
  g.addColorStop(0, "#b98a55"); g.addColorStop(0.33, "#8f6a43"); g.addColorStop(0.66, "#5e4a35"); g.addColorStop(1, "#33291f");
  ctx.fillStyle = g; ctx.fillRect(GX0, GY0, GX1 - GX0, GY1 - GY0);
  ctx.strokeStyle = "rgba(255,255,255,.15)"; ctx.setLineDash([6, 8]);
  [10, 20].forEach((d) => { ctx.beginPath(); ctx.moveTo(GX0, gsy(d)); ctx.lineTo(GX1, gsy(d)); ctx.stroke(); });
  ctx.setLineDash([]);
  text("nông", GX1 - 8, gsy(5), { align: "right", color: "rgba(255,255,255,.45)" });
  text("giữa", GX1 - 8, gsy(15), { align: "right", color: "rgba(255,255,255,.45)" });
  text("sâu", GX1 - 8, gsy(25), { align: "right", color: "rgba(255,255,255,.45)" });
  // bến
  if (meta.dock_pos) {
    const r = meta.dock_radius;
    ctx.fillStyle = "#7a5230"; ctx.fillRect(gsx(0), GY0 - 16, gsx(meta.dock_pos[0] + r) - gsx(0), 16);
    text("Bến Má Tư", gsx(0) + 4, GY0 - 22, { color: "#4a2d14", shadow: false });
  }
  // nút hái
  (s.nodes || []).forEach((n) => {
    const x = gsx(n.pos[0]), y = gsy(n.pos[1]);
    ctx.globalAlpha = n.ready ? 1 : 0.3;
    ctx.fillStyle = "#3d6b2e"; ctx.beginPath(); ctx.ellipse(x, y + 2, 18, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = KIND_COLOR[n.kind] || "#fff";
    for (let i = 0; i < 5; i++) { const a = i * 1.256 + frameT / 900; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 7, y - 8 + Math.sin(a) * 4, 5, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  });
  // cá
  (s.fish || []).forEach((f) => {
    const x = gsx(f.pos[0]), y = gsy(f.pos[1]), dir = Math.cos((f.heading_deg || 0) * Math.PI / 180) >= 0 ? 1 : -1;
    ctx.fillStyle = KIND_COLOR[f.kind] || "#ccc";
    for (let i = 0; i < 3; i++) {
      const ox = (i - 1) * 12, oy = (i % 2) * 7 - 3;
      ctx.beginPath(); ctx.ellipse(x + ox, y + oy, 9, 4.5, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + ox - dir * 8, y + oy); ctx.lineTo(x + ox - dir * 14, y + oy - 5); ctx.lineTo(x + ox - dir * 14, y + oy + 5); ctx.fill();
    }
  });
  // Cá Sấu Năm Chèo
  let monsterNear = false;
  (s.monsters || []).forEach((m) => {
    const x = gsx(m.pos[0]), y = gsy(m.pos[1]);
    const dist = Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]);
    if (m.state === "chase" || dist <= 10) monsterNear = true;
    ctx.fillStyle = m.state === "chase" ? "#5d3f8c" : m.state === "recoil" ? "#6a7a5a" : "#3f5d33";
    roundRect(x - 34, y - 8, 68, 16, 8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 30, y - 6); ctx.lineTo(x + 52, y - 2); ctx.lineTo(x + 30, y + 6); ctx.fill();
    ctx.fillStyle = "#f2e85c"; ctx.beginPath(); ctx.arc(x + 30, y - 6, 3, 0, 7); ctx.fill();
  });
  // Út Sen: áo bà ba, khăn rằn, kính lặn
  const px = gsx(p.pos[0]), py = gsy(p.pos[1]);
  const blink = p.invuln_ticks > 0 && Math.floor(frameT / 100) % 2 === 0;
  if (!blink) {
    ctx.fillStyle = "#3b6fb6"; roundRect(px - 11, py - 4, 22, 24, 6); ctx.fill();
    ctx.fillStyle = "#f0c9a0"; ctx.beginPath(); ctx.arc(px, py - 12, 10, 0, 7); ctx.fill();
    ctx.fillStyle = "#c0392b"; ctx.fillRect(px - 11, py - 20, 22, 5);
    ctx.fillStyle = "#9fe2ff"; ctx.fillRect(px - 8, py - 15, 16, 5);
  }
  // HUD sáng
  drawGatherHud(monsterNear);
}
function drawGatherHud(monsterNear) {
  const s = snap, p = s.player;
  panel(10, 8, W - 20, 104);
  for (let i = 0; i < p.hp_max; i++) heart(34 + i * 28, 20, i < p.hp);
  const oxyFrac = p.oxygen_ticks / p.oxygen_max_ticks;
  const low = oxyFrac < 0.25, flash = low && Math.floor(frameT / 250) % 2 === 0;
  text("Oxy", 24, 76);
  bar(70, 60, 220, 22, oxyFrac, low ? (flash ? "#ff3b30" : "#ff9500") : "#4fc3f7");
  text(`${Math.ceil(p.oxygen_ticks / 60)} s`, 300, 78, { color: low ? "#ff6b5e" : "#f4f1e8" });
  const tl = s.time_left_ticks;
  text("Còn " + fmtTime(tl), 380, 40, { size: 26, bold: true, color: tl <= 30 * 60 ? "#ff6b5e" : "#f4f1e8" });
  const zone = p.pos[1] < 10 ? "nông" : p.pos[1] < 20 ? "giữa" : "sâu";
  text(`Độ sâu ${p.pos[1].toFixed(1)} m (${p.at_surface ? "mặt nước" : zone})`, 380, 76);
  text("Hồi bắt", 380, 102, { color: "#cfd8dc" });
  bar(470, 88, 120, 16, p.catch_cd_ticks > 0 ? 1 - p.catch_cd_ticks / 30 : 1, p.catch_cd_ticks > 0 ? "#ffcc00" : "#7bd389");
  // giỏ theo loại
  const counts = {};
  (s.hold || []).forEach((k) => (counts[k] = (counts[k] || 0) + 1));
  text(`Giỏ ${s.hold_count}/${s.hold_capacity}:`, 650, 40, { bold: true });
  text(Object.keys(counts).map((k) => `${kn(k)} ${counts[k]}`).join(" · ") || "(trống)", 650, 66, { color: "#ffe9b0" });
  // danh sách cần lấy
  if (s.day_plan) {
    const need = s.day_plan.ingredients;
    const line = Object.keys(need).map((k) => `${kn(k)} ${Math.min(counts[k] || 0, need[k])}/${need[k]}`).join(" · ");
    text("Cần lấy: " + line, 650, 96, { color: "#b9f6ca" });
    text(`Ngày ${s.day}`, W - 30, 40, { align: "right", bold: true });
  }
  // gợi ý
  let hint = null;
  const m = s.meta || {};
  if (m.dock_pos && Math.hypot(p.pos[0] - m.dock_pos[0], p.pos[1] - m.dock_pos[1]) <= m.dock_radius) hint = "E: cập bến, mang giỏ về quán";
  else if (p.at_surface) {
    const n = (s.nodes || []).find((n) => n.ready && Math.hypot(n.pos[0] - p.pos[0], n.pos[1] - p.pos[1]) <= m.interact_radius);
    if (n) hint = `E: hái ${kn(n.kind)}`;
  } else {
    const f = (s.fish || []).find((f) => Math.hypot(f.pos[0] - p.pos[0], f.pos[1] - p.pos[1]) <= m.catch_radius);
    if (f) hint = `Space: bắt đàn ${kn(f.kind)}`;
  }
  if (hint) { panel(W / 2 - 220, 126, 440, 38); text(hint, W / 2, 152, { align: "center", color: "#fff3c4" }); }
  if (monsterNear) {
    ctx.strokeStyle = "#a855f7"; ctx.lineWidth = 10; ctx.strokeRect(5, 5, W - 10, H - 10); ctx.lineWidth = 1;
    text("Thủy quái!", W / 2, 205, { size: 34, bold: true, align: "center", color: "#d8b4fe" });
  }
  if (p.oxygen_ticks === 0 && !p.at_surface) text("Hết hơi!", W / 2, 250, { size: 34, bold: true, align: "center", color: "#ff6b5e" });
}

// ---------------- buổi tối: nhà bè nhìn từ trên ----------------
const QX0 = 240, QY1 = 690, QS = 52;
const qsx = (x) => QX0 + x * QS, qsy = (z) => QY1 - z * QS;
function drawQuan() {
  const s = snap, meta = s.meta || {};
  ctx.fillStyle = "#1b2433"; ctx.fillRect(0, 0, W, H);
  // sàn nhà bè
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  ctx.fillStyle = "#8a6239"; ctx.fillRect(qsx(b.x[0]), qsy(b.z[1]), (b.x[1] - b.x[0]) * QS, (b.z[1] - b.z[0]) * QS);
  ctx.strokeStyle = "rgba(0,0,0,.18)";
  for (let x = b.x[0]; x <= b.x[1]; x++) { ctx.beginPath(); ctx.moveTo(qsx(x), qsy(b.z[0])); ctx.lineTo(qsx(x), qsy(b.z[1])); ctx.stroke(); }
  // đèn dây vàng
  for (let i = 0; i < 17; i++) { ctx.fillStyle = `rgba(255,214,102,${0.55 + 0.45 * Math.sin(frameT / 400 + i)})`; ctx.beginPath(); ctx.arc(qsx(i), qsy(b.z[1]) - 8 + Math.sin(i) * 3, 5, 0, 7); ctx.fill(); }
  const custByTable = {};
  (s.customers || []).forEach((c) => (custByTable[c.table_id] = c));
  const patienceFull = (meta.patience_s || 60) * 60;
  // bếp
  (s.stoves || []).forEach((st) => {
    const x = qsx(st.pos[0]), y = qsy(st.pos[1]);
    ctx.fillStyle = st.state === "ready" ? "#e0a030" : st.state === "cooking" ? "#c0503a" : "#555";
    roundRect(x - 34, y - 26, 68, 52, 8); ctx.fill();
    text(st.id, x, y - 32, { align: "center", bold: true });
    if (st.state === "cooking" && st.dish) {
      const total = (s.menu_data && s.menu_data[st.dish.dish_id] ? s.menu_data[st.dish.dish_id].cook_s * 60 : 600);
      bar(x - 34, y + 30, 68, 12, 1 - st.cook_ticks_left / total, "#ffcc00");
      for (let i = 0; i < 3; i++) { ctx.fillStyle = "rgba(220,220,220,.35)"; ctx.beginPath(); ctx.arc(x - 12 + i * 12, y - 34 - ((frameT / 20 + i * 15) % 30), 6, 0, 7); ctx.fill(); }
    }
    if (st.state === "ready") text("Chín!", x, y + 8, { align: "center", bold: true, color: "#1b1b1b", shadow: false });
  });
  // bàn + khách
  (s.tables || []).forEach((tb) => {
    const x = qsx(tb.pos[0]), y = qsy(tb.pos[1]);
    ctx.fillStyle = "#5b3a1e"; ctx.beginPath(); ctx.arc(x, y, 28, 0, 7); ctx.fill();
    text(tb.id, x, y + 7, { align: "center", bold: true });
    const c = custByTable[tb.id];
    if (c) {
      ctx.fillStyle = c.state === "eating" ? "#7bd389" : "#f0c9a0";
      ctx.beginPath(); ctx.arc(x + 40, y, 13, 0, 7); ctx.fill();
      text(dn(c.dish_id), x, y - 42, { align: "center", size: 18 });
      if (c.state === "waiting") {
        const f = c.patience_ticks_left / patienceFull;
        bar(x - 50, y + 36, 100, 12, f, f < 0.25 ? "#ff3b30" : f < 0.5 ? "#ffcc00" : "#7bd389");
      } else text("đang ăn", x, y + 52, { align: "center", color: "#b9f6ca" });
    }
  });
  // Út Sen
  const p = s.player;
  ctx.fillStyle = "#3b6fb6"; ctx.beginPath(); ctx.arc(qsx(p.pos[0]), qsy(p.pos[1]), 14, 0, 7); ctx.fill();
  ctx.fillStyle = "#c0392b"; ctx.fillRect(qsx(p.pos[0]) - 10, qsy(p.pos[1]) - 6, 20, 5);
  // HUD quán
  panel(10, 8, W - 20, 110);
  text("Ca tối còn " + fmtTime(s.time_left_ticks), 24, 42, { size: 26, bold: true, color: s.time_left_ticks <= 1800 ? "#ff6b5e" : "#f4f1e8" });
  text(`Tiền ca: ${s.day_stat ? s.day_stat.income : s.earned} nghìn · Số dư: ${s.money}`, 24, 74);
  text(`Uy tín ${s.reputation.toFixed(1)} ★ · Điểm ${s.score}`, 24, 104);
  const reserved = {};
  (s.customers || []).forEach((c) => Object.keys(c.reserved || {}).forEach((k) => (reserved[k] = (reserved[k] || 0) + c.reserved[k])));
  const avail = Object.keys(s.stock || {}).map((k) => `${kn(k)} ${s.stock[k] - (reserved[k] || 0)}`).join(" · ");
  text("Kho khả dụng: " + (avail || "(trống)"), 470, 42, { color: "#ffe9b0" });
  text("Đang cầm: " + (s.hand ? `${dn(s.hand.dish_id)} (bàn của ${s.hand.order_id})` : "—"), 470, 74);
  if (s.day) text(`Ngày ${s.day}`, W - 30, 42, { align: "right", bold: true });
  text("E: nấu ở bếp trống · bưng món chín · phục vụ ở bàn", 470, 104, { color: "#cfd8dc" });
}

// ---------------- Shop ----------------
function drawShop() {
  const s = snap;
  ctx.fillStyle = "#1d2b22"; ctx.fillRect(0, 0, W, H);
  panel(240, 90, 800, 540, 0.75);
  text("Tiệm Chú Ba — nâng cấp cho lần lặn sau", W / 2, 150, { size: 30, bold: true, align: "center" });
  text(`Tiền: ${s.money} nghìn · Shop tự đóng sau ${fmtTime(s.time_left_ticks)}`, W / 2, 195, { align: "center", color: "#ffe9b0" });
  const ups = (s.shop_data && s.shop_data.upgrades) || {};
  ["oxygen", "hp"].forEach((uid, i) => {
    const lv = (s.upgrades || {})[uid] || 0, levels = ups[uid] || [], nxt = levels[lv];
    const y = 260 + i * 120;
    panel(290, y, 700, 96, 0.5);
    text(`${i + 1} — ${UP_NAME[uid]}`, 315, y + 38, { size: 26, bold: true });
    text(`Cấp ${lv}/${levels.length}` + ((s.active_upgrades || {})[uid] !== lv ? " (có hiệu lực từ Ngày kế)" : ""), 315, y + 74, { color: "#cfd8dc" });
    const eff = nxt ? (uid === "oxygen" ? `${nxt.oxygen_max_s} s oxy` : `${nxt.hp_max} Máu`) : "";
    text(nxt ? `${nxt.price} nghìn → ${eff}` : "Đã tối đa", 965, y + 56, { align: "right", color: nxt && s.money >= nxt.price ? "#7bd389" : "#ff9e8a" });
  });
  const last = (s.events || []).filter((e) => e.name === "bought" || e.name === "buy_failed").slice(-1)[0];
  if (last) {
    const REASON = { funds: "không đủ tiền", max_level: "đã tối đa", unknown: "không có món này", out_of_stock: "hết hàng" };
    text(last.name === "bought" ? `Đã mua ${UP_NAME[last.data.upgrade]} cấp ${last.data.level}` : `Không mua được: ${REASON[last.data.reason] || last.data.reason}`,
      W / 2, 540, { align: "center", color: last.name === "bought" ? "#7bd389" : "#ff9e8a" });
  }
  text("Phím 1 / 2 để mua · Enter: xong, sang Ngày kế", W / 2, 600, { align: "center" });
}

// ---------------- màn chuyển và menu ----------------
function dim(a = 0.72) { ctx.fillStyle = `rgba(5,8,12,${a})`; ctx.fillRect(0, 0, W, H); }
function drawOverlay(ov) {
  const s = snap;
  if (ov === "menu") {
    dim(0.85);
    text("Quán Ăn Chợ Nổi", W / 2, 220, { size: 56, bold: true, align: "center", color: "#ffd27a" });
    text("Út Sen lặn sông Chín Khúc buổi sáng, tối phụ Má Tư bán quán trên nhà bè", W / 2, 270, { align: "center", color: "#cfd8dc" });
    button("Chơi", W / 2 - 120, 340, 240, 56, menuSel === 0, cont);
    button("Thoát", W / 2 - 120, 412, 240, 56, menuSel === 1, doQuit);
    text("WASD/mũi tên · E tương tác · Space bắt cá · Esc/P tạm dừng", W / 2, 540, { align: "center", color: "#9fb3c8" });
  } else if (ov === "day_intro") {
    dim();
    if (!introShownAt) introShownAt = performance.now();
    text(`Ngày ${s.day}`, W / 2, 200, { size: 52, bold: true, align: "center", color: "#ffd27a" });
    text("Má Tư dặn: “Bữa nay má tính nấu mấy món nầy nghen con:”", W / 2, 260, { align: "center" });
    plantDish(s.day_plan.dishes).forEach((l, i) => text("• " + l, W / 2, 310 + i * 34, { align: "center", color: "#fff3c4" }));
    const need = s.day_plan.ingredients;
    text("Cần lấy: " + Object.keys(need).map((k) => `${kn(k)} ×${need[k]}`).join(", "), W / 2, 450, { align: "center", color: "#b9f6ca" });
    text("Nhấn phím bất kỳ để xuống sông (tự chuyển sau 4 s)", W / 2, 540, { align: "center", color: "#9fb3c8" });
    if (performance.now() - introShownAt > 4000) cont();
  } else if (ov === "evening_intro") {
    dim();
    text("Lên đèn mở quán!", W / 2, 200, { size: 46, bold: true, align: "center", color: "#ffd27a" });
    const st = s.stock || {};
    text("Nhập kho: " + (Object.keys(st).map((k) => `${kn(k)} ×${st[k]}`).join(", ") || "không có gì"), W / 2, 270, { align: "center" });
    const can = Object.keys(s.day_plan ? s.day_plan.dishes : s.menu_data || {}).filter((d) =>
      Object.entries(s.menu_data[d].recipe).every(([k, v]) => (st[k] || 0) >= v));
    text("Món nấu được: " + (can.map(dn).join(", ") || "chưa đủ nguyên liệu món nào"), W / 2, 320, { align: "center", color: "#fff3c4" });
    text("Nhấn phím bất kỳ để bắt đầu", W / 2, 520, { align: "center", color: "#9fb3c8" });
  } else if (ov === "day_result") {
    dim();
    const d = (s.stats.days || []).slice(-1)[0] || {};
    text(`Kết quả Ngày ${d.day || s.day}`, W / 2, 190, { size: 46, bold: true, align: "center", color: "#ffd27a" });
    const rep = (d.rep_end - d.rep_start) || 0;
    [`Khách đã phục vụ: ${d.served || 0}`, `Khách bỏ đi: ${d.left || 0}`, `Tiền thu: ${d.income || 0} nghìn (boa ${d.tips || 0})`,
      `Uy tín: ${(d.rep_start || 0).toFixed(1)} → ${(d.rep_end || 0).toFixed(1)} (${rep >= 0 ? "+" : ""}${rep.toFixed(1)})`]
      .forEach((l, i) => text(l, W / 2, 270 + i * 44, { align: "center" }));
    text("Nhấn phím bất kỳ để vào tiệm nâng cấp", W / 2, 520, { align: "center", color: "#9fb3c8" });
  } else if (ov === "summary") {
    dim(0.85);
    text(`Tổng kết ${s.days_completed} ngày ở chợ nổi`, W / 2, 180, { size: 46, bold: true, align: "center", color: "#ffd27a" });
    const sold = s.stats.dish_sold || {};
    const best = Object.keys(sold).sort((a, b) => sold[b] - sold[a])[0];
    [`Tổng tiền thu: ${s.earned} nghìn · Số dư: ${s.money}`, `Uy tín: ${s.reputation.toFixed(1)} ★`, `Tổng điểm: ${s.score}`,
      `Món bán chạy: ${best ? `${dn(best)} (${sold[best]} suất)` : "—"}`]
      .forEach((l, i) => text(l, W / 2, 260 + i * 46, { align: "center" }));
    button("Về menu", W / 2 - 120, 480, 240, 56, true, toMenu);
  } else if (ov === "pause") {
    dim(0.6);
    text("Tạm dừng", W / 2, 260, { size: 48, bold: true, align: "center" });
    button("Tiếp tục", W / 2 - 120, 320, 240, 56, pauseSel === 0, () => tap("pause"));
    button("Về menu", W / 2 - 120, 392, 240, 56, pauseSel === 1, toMenu);
  } else if (ov === "quit") {
    dim(0.95);
    text("Đã thoát. Hẹn gặp lại ở chợ nổi Rạch Sen!", W / 2, H / 2, { size: 30, align: "center" });
  }
}

function drawEnd() {
  if (!snap.finished || snap.mode === "day") return;
  dim(0.6);
  text(snap.phase === "gather" ? `Kết thúc buổi sáng: ${snap.reason}` : "Hết ca tối", W / 2, H / 2 - 20, { size: 34, bold: true, align: "center" });
  text(`Điểm ${snap.score} · R để chơi lại`, W / 2, H / 2 + 24, { align: "center" });
}

function frame(t) {
  frameT = t;
  fit();
  buttons = [];
  ctx.fillStyle = "#0d1218"; ctx.fillRect(0, 0, W, H);
  if (!snap) { text(offline ? "Mất kết nối tới máy chủ" : "Đang tải…", W / 2, H / 2, { align: "center" }); }
  else {
    if (snap.error) { text("Lỗi luật: xem terminal", W / 2, H / 2, { align: "center", color: "#ff6b5e" }); }
    else if (snap.phase === "shop") drawShop();
    else if (snap.phase === "quan") drawQuan();
    else drawGather();
    drawEnd();
    const ov = overlayActive();
    if (ov !== lastHold) { lastHold = ov; introShownAt = 0; menuSel = 0; }
    if (ov) drawOverlay(ov);
    if (offline) text("Mất kết nối", W - 20, H - 20, { align: "right", color: "#ff6b5e" });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
